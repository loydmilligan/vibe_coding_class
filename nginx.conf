server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Keep redirects (e.g. /terminal -> /terminal/) relative, so they work behind a tunnel.
    absolute_redirect off;

    # The help bot backend. Only this path leaves nginx.
    location /api/ {
        proxy_pass http://helper:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Cloudflare Access adds this header; the backend verifies it.
        proxy_set_header Cf-Access-Jwt-Assertion $http_cf_access_jwt_assertion;
        proxy_read_timeout 60s;
        client_max_body_size 64k;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
