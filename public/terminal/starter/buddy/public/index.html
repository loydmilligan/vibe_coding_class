<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>terminal-buddy</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; max-width: 760px; margin: 0 auto; padding: 16px; }
    h1 { font-family: monospace; color: #a3e635; }
    #log { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
    .msg { padding: 10px 14px; border-radius: 10px; white-space: pre-wrap; line-height: 1.5; }
    .me { background: #334155; align-self: flex-end; }
    .bot { background: #1e293b; border: 1px solid #334155; }
    pre { background: #000; padding: 10px; border-radius: 6px; overflow-x: auto; white-space: pre; }
    code { font-family: monospace; color: #fbcfe8; }
    form { display: flex; gap: 8px; }
    textarea { flex: 1; background: #1e293b; color: white; border: 1px solid #475569; border-radius: 8px; padding: 10px; font: inherit; }
    button { background: #65a30d; color: white; border: 0; border-radius: 8px; padding: 0 18px; font: inherit; cursor: pointer; }
  </style>
</head>
<body>
  <h1>terminal-buddy</h1>
  <div id="log"></div>
  <form id="form">
    <textarea id="box" rows="3" placeholder="Ask about any terminal command... (Enter to send)"></textarea>
    <button>Send</button>
  </form>
  <script>
    const messages = [];
    const log = document.getElementById("log");
    const box = document.getElementById("box");

    function escapeHtml(s) {
      return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
    // Shows ```code blocks``` and `inline code`; everything else stays plain text.
    function format(text) {
      const fence = String.fromCharCode(96, 96, 96);
      const tick = String.fromCharCode(96);
      return escapeHtml(text)
        .split(fence)
        .map((part, i) => (i % 2 ? "<pre>" + part.replace(/^[a-z]*\n/, "") + "</pre>" : part.split(tick).map((p, j) => (j % 2 ? "<code>" + p + "</code>" : p)).join("")))
        .join("");
    }
    function show(role, text) {
      const div = document.createElement("div");
      div.className = "msg " + (role === "user" ? "me" : "bot");
      div.innerHTML = format(text);
      log.appendChild(div);
      window.scrollTo(0, document.body.scrollHeight);
      return div;
    }
    async function send() {
      const text = box.value.trim();
      if (!text) return;
      box.value = "";
      messages.push({ role: "user", content: text });
      show("user", text);
      const waiting = show("assistant", "Thinking...");
      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ messages }),
        });
        const data = await res.json();
        const answer = data.reply || data.error || "No answer.";
        waiting.innerHTML = format(answer);
        if (data.reply) messages.push({ role: "assistant", content: data.reply });
      } catch (err) {
        waiting.textContent = "Couldn't reach the server. Is the container running?";
      }
    }
    document.getElementById("form").addEventListener("submit", (e) => { e.preventDefault(); send(); });
    box.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } });
  </script>
</body>
</html>
